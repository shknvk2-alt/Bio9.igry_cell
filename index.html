<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аркадний портал (8 ігор)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2f;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 30px 20px;
        }
        h1 { margin-bottom: 5px; }
        p.subtitle { color: #b0b0c3; margin-bottom: 30px; }
        
        .user-box {
            background: #2f2f4f;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 30px;
        }
        input {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            outline: none;
            width: 220px;
            text-align: center;
        }

        .games-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .game-card {
            background: #2f2f4f;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, background 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            background: #38385e;
        }
        .game-card h3 { margin-top: 0; color: #4df; }
        .game-card a {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 16px;
            background: #4e54c8;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .game-card a:hover { background: #6c72e8; }
    </style>
</head>
<body>

    <h1>🎮 Мої міні-ігри</h1>
    <p class="subtitle">Введіть своє ім'я та вибирайте гру для змагання в таблиці!</p>

    <div class="user-box">
        <label for="playerName">Ваше ім'я (нікнейм):</label><br><br>
        <input type="text" id="playerName" placeholder="Введіть нік...">
    </div>

    <!-- Сітка з 8 іграми -->
    <div class="games-container">
        <div class="game-card">
            <h3>Змійка</h3>
            <a href="snake.html" onclick="saveName()">Грати</a>
        </div>
        <div class="game-card">
            <h3>Тетріс</h3>
            <a href="tetris.html" onclick="saveName()">Грати</a>
        </div>
        <div class="game-card">
            <h3>Клікер</h3>
            <a href="clicker.html" onclick="saveName()">Грати</a>
        </div>
        <div class="game-card">
            <h3>Вгадай число</h3>
            <a href="guess.html" onclick="saveName()">Грати</a>
        </div>
        <div class="game-card">
            <h3>Хрестики-нулики</h3>
            <a href="tictactoe.html" onclick="saveName()">Грати</a>
        </div>
        <div class="game-card">
            <h3>Пам'ять</h3>
            <a href="memory.html" onclick="saveName()">Грати</a>
        </div>
        <div class="game-card">
            <h3>Пінг-понг</h3>
            <a href="pong.html" onclick="saveName()">Грати</a>
        </div>
        <div class="game-card">
            <h3>Стрибки</h3>
            <a href="jump.html" onclick="saveName()">Грати</a>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedName = localStorage.getItem("playerName");
            if (savedName) document.getElementById('playerName').value = savedName;
        };

        function saveName() {
            const nameInput = document.getElementById('playerName').value.trim();
            localStorage.setItem("playerName", nameInput || "Гість");
        }
    </script>

</body>
</html>
