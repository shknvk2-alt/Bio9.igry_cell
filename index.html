<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аркадний портал</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        p.subtitle {
            color: #b0b0c3;
            margin-bottom: 40px;
        }
        .user-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        input {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            outline: none;
            width: 220px;
            text-align: center;
        }
        .games-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .game-card {
            background: #2f2f4f;
            padding: 20px;
            border-radius: 12px;
            width: 220px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 0.2s, background 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            background: #38385e;
        }
        .game-card h3 {
            margin-top: 0;
            color: #4df;
        }
        .game-card a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #4e54c8;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .game-card a:hover {
            background: #6c72e8;
        }
    </style>
</head>
<body>

    <h1>🎮 Мої міні-ігри</h1>
    <p class="subtitle">Обирай гру, вводь своє ім'я та змагайся за кращий результат!</p>

    <!-- Поле для введення нікнейму -->
    <div class="user-box">
        <label for="playerName">Ваше ім'я (нікнейм):</label><br><br>
        <input type="text" id="playerName" placeholder="Введіть нік...">
    </div>

    <!-- Список ігор -->
    <div class="games-container">
        
        <!-- Гра 1 -->
        <div class="game-card">
            <h3>Змійка</h3>
            <p>Збирайте яблука та не врізайтеся в стіни.</p>
            <a href="snake.html" onclick="saveName()">Грати</a>
        </div>

        <!-- Гра 2 -->
        <div class="game-card">
            <h3>Тетріс</h3>
            <p>Складайте лінії з фігур, що падають.</p>
            <a href="tetris.html" onclick="saveName()">Грати</a>
        </div>

    </div>

    <script>
        // Коли сторінка завантажується, перевіряємо, чи є збережене ім'я в пам'яті браузера
        window.onload = function() {
            const savedName = localStorage.getItem("playerName");
            if (savedName) {
                document.getElementById('playerName').value = savedName;
            }
        };

        // Функція, яка зберігає ім'я перед тим, як гравець клісне "Грати"
        function saveName() {
            const nameInput = document.getElementById('playerName').value.trim();
            if (nameInput) {
                localStorage.setItem("playerName", nameInput);
            } else {
                localStorage.setItem("playerName", "Гість");
            }
        }
    </script>

</body>
</html>
